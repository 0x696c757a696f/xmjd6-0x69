name: Create Release with Zipped Branch Assets and Date

on:
  workflow_dispatch:

env:
  OPENCC_TONGGUI_URL: https://github.com/amorphobia/opencc-tonggui/releases/download/latest/opencc-tonggui.zip
  OPENCC_TONGGUI_SHA256: 1b76a1028669b89d55a9055400e8be628014ea6f3b200b34b5e8a7d88f04e018
  YONG_WIN_URL: https://github.com/hugh7007/xmjd6-rere/releases/download/20231115/yong-win.7z
  YONG_INI_URL: https://github.com/hugh7007/xmjd6-rere/releases/download/20231115/yong.ini
  YONG_WIN_SHA256: bd6ff885eeb5c918b46dcc7d040183a160aeb52433c67ffdb6984ff7fd7f6526
  YONG_INI_SHA256: fef5ada081436b7f43fd847712702a669bee872a3e1c3d1becfe9c8ae9704140
  RABBIT_TAG: v0.4.0
  RABBIT_URL: https://github.com/rimeinn/rabbit/releases/download/v0.4.0/rabbit-v0.4.0-x64.zip
  RABBIT_SHA256: 33a66a9a87845ea0eb78d552a8002c4a49902575f62422327032b29c4115a6ad

jobs:
  build-windows-executables:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: '3.14.6'

    - name: Install pinned executable builder
      run: python -m pip install pyinstaller==6.21.0

    - name: Build Windows executables from current Python sources
      run: python tools/build_zzc_windows_exe.py

    - name: Run rebuilt Windows executable checks
      run: python -m unittest tests.test_tools.RepositoryValidationTests.test_windows_merge_executable_runs_current_xmjd6_behavior tests.test_tools.RepositoryValidationTests.test_windows_rollback_executable_restores_latest_merge tests.test_tools.RepositoryValidationTests.test_committed_windows_executables_match_sources_and_lock -v

    - name: Upload rebuilt Windows executables
      uses: actions/upload-artifact@v7
      with:
        name: zzc-windows-executables
        path: |
          zzc/Win_词库合并.exe
          zzc/Win_撤回合并.exe
        if-no-files-found: error
        retention-days: 1

  release:
    needs: build-windows-executables
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - name: Set up environment variables
      run: |
        echo "CURRENT_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
        echo "RELEASE_TITLE=$(date +'%Y.%m.%d') 词库更新" >> $GITHUB_ENV

    - name: Checkout main branch
      uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Validate source tree
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.4
        python -m pip install -r requirements-dev.txt
        python tools/validate_repo.py
        lua5.4 tests/run.lua
        python -m unittest discover -s tests -p 'test_*.py' -v

    - name: Use Windows executables rebuilt by CI
      uses: actions/download-artifact@v7
      with:
        name: zzc-windows-executables
        path: zzc

    - name: Create directories
      run: |
        mkdir -p Rime
        mkdir -p mb/xmjd6

    - name: Download verified OpenCC data
      run: |
        python tools/fetch_opencc.py \
          --url "$OPENCC_TONGGUI_URL" \
          --sha256 "$OPENCC_TONGGUI_SHA256" \
          --destination opencc/xmjd6
      
    - name: Zip main branch files excluding .git and .github
      # 此时 opencc/xmjd6 里的文件已经存在，会被包含在下面的 xmjd6.zip 中（因为没有被 -x 排除）
      run: zip -r xmjd6.zip . -x "*.git*" -x "*.github*" -x "yong*" -x "mb*" -x "Rime*" -x "tests/*" -x "tools/*" -x "VERSION" -x "requirements-dev.txt"

    - name: Prepare Rime directory for Rabbit
      run: |
        mkdir -p Rime/
        rsync -avm --exclude='.git*' --exclude='*.github*' --exclude='squirrel*' --exclude='weasel*' --exclude='hamster*' --exclude='*.txt' --exclude='xmjd6.zip' --exclude='yong*' --exclude='mb*' --exclude='Rime*' --exclude='/tests/' --exclude='/tools/' --exclude='/VERSION' --exclude='/requirements-dev.txt' . Rime/
        ls -al Rime/
        pwd

    - name: Fetch tags and generate changelog from last release
      id: changelog
      uses: actions/github-script@v9
      with:
        script: |
          const lastRelease = await github.rest.repos.getLatestRelease({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          const compare = await github.rest.repos.compareCommits({
            owner: context.repo.owner,
            repo: context.repo.repo,
            base: lastRelease.data.tag_name,
            head: 'main'
          });
          let changelog = '';
          compare.data.commits.forEach(commit => {
            const message = commit.commit.message.split('\n').join(' ');
            const commitLink = `[${commit.sha.substring(0, 7)}](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${commit.sha})`;
            changelog += `- ${commitLink} ${message} \n`;
          });
          core.setOutput('changelog', changelog);

    - name: Download verified Rabbit release asset
      run: |
        curl --fail --location --output "rabbit-$RABBIT_TAG.zip" "$RABBIT_URL"
        echo "$RABBIT_SHA256  rabbit-$RABBIT_TAG.zip" | sha256sum --check --strict
      
    - name: Unzip Rabbit
      run: |
        mkdir -p Rabbit
        unzip "rabbit-$RABBIT_TAG.zip" -d Rabbit

    - name: Clean Data
      run: |
        mkdir -p /tmp/Rabbit_backup
        cp Rabbit/Data/punctuation.yaml /tmp/Rabbit_backup/
        cp Rabbit/Data/key_bindings.yaml /tmp/Rabbit_backup/
        cp Rabbit/Data/default.yaml /tmp/Rabbit_backup/
        cp Rabbit/Data/symbols.yaml /tmp/Rabbit_backup/
        cp Rabbit/Data/rabbit.yaml /tmp/Rabbit_backup/        
        cp Rime/default.custom.yaml Rabbit/Rime
        cp Rime/xmjd6.user.dict.yaml Rabbit/Rime
        cp Rime/xmjd6.custom.yaml Rabbit/Rime
        rm -rf Rabbit/Data/*
        rm -f Rime/default.custom.yaml
        rm -f Rime/xmjd6.user.dict.yaml
        rm -f Rime/xmjd6.custom.yaml
        cp /tmp/Rabbit_backup/* Rabbit/Data/
        rm -rf /tmp/Rabbit_backup

    - name: Merge Rime into Rabbit
      run: |
        cp -r Rime/. Rabbit/Data
        zip -r Rabbit-xmjd6.zip Rabbit/

    - name: Convert .dict.yaml files to .txt using Bash
      run: |
        for dict_file in xmjd6.core.dict.yaml xmjd6.danzi.dict.yaml xmjd6.catholicism.dict.yaml xmjd6.protestantism.dict.yaml xmjd6.orthodoxy.dict.yaml xmjd6.oriental.dict.yaml xmjd6.assyrian.dict.yaml xmjd6.cizu.dict.yaml xmjd6.fjcy.dict.yaml xmjd6.ice.dict.yaml xmjd6.en.dict.yaml
        do
          base=$(basename "$dict_file")
          if [[ "$base" == *.dict.yaml ]]; then
            txt_name="${base%.dict.yaml}.txt"
          else
            txt_name="${base%.yaml}.txt"
          fi
          txt_file="Rime/$txt_name"
          awk -F'\t' '
          /^[^#]/ {
            if ($0 ~ /^---|name:|version:|sort:|\.\.\.$/) next;
            if (FILENAME ~ /xmjd6[.]en[.]dict[.]yaml$/) {
              print $2 " " $1
            } else if ($1 ~ /^[A-Za-z0-9\s]+$/) {
              print $1 " " $2
            } else {
              print $2 " " $1
            }
          }' "$dict_file" > "$txt_file"
        done

    - name: Merge .txt files in specific order, add header
      run: |
        # 创建头文件
        header='name=星猫键道6\nkey=`abcedfghijklmnopqrstuvwxyz;\\\nlen=12\nwildcard=~\nbihua=viuoa\ncode_e2=p11+p12+p21+p22+p13+p23\ncode_e3=p11+p21+p31+p13+p23+p33\ncode_a4=p11+p21+p31+n11+p13+p23+p33\n[DATA]'
        echo -e "$header" > Rime/xmjd6.header.txt
        
        # 按照指定顺序合并 .txt 文件
        cat Rime/xmjd6.danzi.txt \
            Rime/xmjd6.cizu.txt \
            Rime/xmjd6.catholicism.txt \
            Rime/xmjd6.protestantism.txt \
            Rime/xmjd6.orthodoxy.txt \
            Rime/xmjd6.oriental.txt \
            Rime/xmjd6.assyrian.txt \
            Rime/xmjd6.core.txt \
            Rime/xmjd6.fjcy.txt \
            Rime/xmjd6.ice.txt \
            Rime/xmjd6.en.txt > Rime/xmjd6.body.txt
        
        # 将头文件和主体文件合并到一个中间文件
        cat Rime/xmjd6.header.txt Rime/xmjd6.body.txt > mb/xmjd6/tmp_xmjd6.txt
        
        # 将中间文件移动到最终位置
        mv mb/xmjd6/tmp_xmjd6.txt mb/xmjd6/xmjd6.txt
    - name: Generate dazhu.txt from xmjd6.body.txt，and clean up
      run: |
        # 1. 检查输入文件
        if [ ! -f Rime/xmjd6.body.txt ]; then
          echo "Error: Rime/xmjd6.body.txt not found. Cannot proceed."
          exit 1
        fi
        
        # 2. 对文件进行排序 (稳定排序)
        #    -k1,1 按第一列 (编码) 排序
        #    -s (--stable) **关键修正：** 保持相同键的原始相对顺序
        sort -k1,1 -s Rime/xmjd6.body.txt > /tmp/sorted_body.txt
        
        # 3. AWK 脚本 (保持不变，它会忠实地执行 sorted_body.txt 的顺序)
        awk '
        BEGIN {
            OFS = "\t";      # 输出分隔符为制表符
            prev_code = "";  # 跟踪上一个编码
            buffer = "";     # 缓存归并的词语
        }
        {
            # $1 是编码, 获取词语部分（从第一个空格后开始）
            code = $1;
            word = substr($0, length($1) + 2);
            
            if (word == "") { next; }
            
            if (code != prev_code && prev_code != "") {
                print prev_code, buffer;
                buffer = "";
            }
            
            if (buffer == "") {
                buffer = word;
            } else {
                buffer = buffer OFS word; 
            }
            
            prev_code = code;
        }
        END {
            if (prev_code != "") {
                print prev_code, buffer;
            }
        }
        ' /tmp/sorted_body.txt > dazhu.txt
        
        # 4. 检查文件并清理
        ls -al dazhu.txt
        rm /tmp/sorted_body.txt Rime/xmjd6.header.txt Rime/xmjd6.body.txt
        
        # 5. 编码转换 (保持不变)
        python -c "with open('mb/xmjd6/xmjd6.txt', 'r', encoding='utf-8') as f: data = f.read(); open('mb/xmjd6/xmjd6.txt', 'w', encoding='gb18030', errors='ignore').write(data)"
        
    - name: Zip yong
      run: |
        mkdir -p .yong
        curl --fail --location --output yong-win.7z "$YONG_WIN_URL"
        curl --fail --location --output yong.ini "$YONG_INI_URL"
        echo "$YONG_WIN_SHA256  yong-win.7z" | sha256sum --check --strict
        echo "$YONG_INI_SHA256  yong.ini" | sha256sum --check --strict
        cp yong.ini .yong/
        cp -r mb .yong/
        zip -r yong-xmjd6.zip .yong
        7z x yong-win.7z -oyong_temp
        cp -r .yong yong_temp/yong
        cd yong_temp
        zip -r ../yong-xmjd6-full.zip yong
        rm -rf ../.yong ../yong_temp

    - name: Create Release
      id: create_release
      uses: shogo82148/actions-create-release@v1.9.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.CURRENT_DATE }}
        release_name: ${{ env.RELEASE_TITLE }}
        body: |
          ## Changelog
          ${{ steps.changelog.outputs.changelog }}
          ## Release Notes
          - [如何使用](${{ github.server_url }}/${{ github.repository }}#如何使用)
        draft: false
        prerelease: false

    - name: Upload Rabbit-xmjd6.zip to Release
      uses: shogo82148/actions-upload-release-asset@v1.10.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./Rabbit-xmjd6.zip
        asset_name: Rabbit-xmjd6.zip
        asset_content_type: application/zip

    - name: Upload yong-xmjd6.zip to Release
      uses: shogo82148/actions-upload-release-asset@v1.10.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./yong-xmjd6.zip
        asset_name: yong-xmjd6.zip
        asset_content_type: application/zip

    - name: Upload yong-xmjd6-full.zip to Release
      uses: shogo82148/actions-upload-release-asset@v1.10.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./yong-xmjd6-full.zip
        asset_name: yong-xmjd6-full.zip
        asset_content_type: application/zip
        
    - name: Upload xmjd6.zip to Release
      uses: shogo82148/actions-upload-release-asset@v1.10.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./xmjd6.zip
        asset_name: xmjd6.zip
        asset_content_type: application/zip
        
    - name: Upload dazhu.txt to Release
      uses: shogo82148/actions-upload-release-asset@v1.10.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dazhu.txt
        asset_name: dazhu.txt
        asset_content_type: text/plain; charset=utf-8
