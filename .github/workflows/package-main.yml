name: Package Main Branch

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  OPENCC_TONGGUI_URL: https://github.com/amorphobia/opencc-tonggui/releases/download/latest/opencc-tonggui.zip
  OPENCC_TONGGUI_SHA256: 1b76a1028669b89d55a9055400e8be628014ea6f3b200b34b5e8a7d88f04e018

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Validate source tree
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.4
        python -m pip install -r requirements-dev.txt
        python tools/validate_repo.py
        lua5.4 tests/run.lua
        python -m unittest discover -s tests -p 'test_*.py' -v

    - name: Download verified OpenCC data
      run: |
        python tools/fetch_opencc.py \
          --url "$OPENCC_TONGGUI_URL" \
          --sha256 "$OPENCC_TONGGUI_SHA256" \
          --destination opencc/xmjd6

    - uses: actions/upload-artifact@v6
      with:
        name: xmjd6
        path: |
          **/*
          !.git/**
          !.github/**
          !.git*
          !yong*.*
          !tests/**
          !tools/**
          !VERSION
          !requirements-dev.txt
